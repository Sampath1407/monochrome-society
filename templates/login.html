<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Monochrome Society</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="auth-page">

        <div class="auth-container">

            <p class="auth-label">
                MONOCHROME SOCIETY
            </p>

            <h1>
                Welcome Back
            </h1>

            <p class="auth-description">
                Login to your Monochrome Society account.
            </p>

            {% if error %}

                <div class="auth-error">
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('login') }}"
                class="auth-form"
            >

                <div class="auth-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    LOGIN
                </button>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="{{ url_for('signup') }}">
                    Sign Up
                </a>

            </p>

        </div>

    </div>

</body>

</html>
