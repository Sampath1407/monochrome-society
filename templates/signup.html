<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Monochrome Society</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="auth-page">

        <div class="auth-container">

            <p class="auth-label">
                MONOCHROME SOCIETY
            </p>

            <h1>
                Join the Society
            </h1>

            <p class="auth-description">
                Create your account and become part of the community.
            </p>

            {% if error %}

                <div class="auth-error">
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('signup') }}"
                class="auth-form"
            >

                <div class="auth-field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    CREATE ACCOUNT
                </button>

            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </p>

        </div>

    </div>

</body>

</html>
